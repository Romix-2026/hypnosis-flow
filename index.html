<title>催眠流程引导</title>
<style>
/* 催眠流程引导 · 样式（移动端优先，纸墨暖色） */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #f6f4ef;
  color: #2c2a26;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
#app { height: 100%; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; }

/* ===== 布局骨架 ===== */
.screen { display: flex; flex-direction: column; height: 100%; }
.hd {
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 18px 10px;
  border-bottom: 1px solid #e7e2d8;
  background: #f6f4ef;
  flex-shrink: 0;
}
.hd .step-title { font-size: 15px; font-weight: 600; color: #4a4640; line-height: 1.45; }
.hd .unit-pos { font-size: 12px; color: #9a938a; margin-top: 2px; }
.body {
  flex: 1; overflow: hidden; padding: 18px 20px;
  display: flex; flex-direction: column; min-height: 0;
}
.ft {
  flex-shrink: 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
  border-top: 1px solid #e7e2d8; background: #f6f4ef;
  display: flex; gap: 10px; align-items: center;
}

/* ===== 按钮 ===== */
.btn {
  flex: 1; border: none; border-radius: 12px; padding: 13px 10px;
  font-size: 16px; font-weight: 600; cursor: pointer;
  transition: opacity .15s, transform .05s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .35; }
.btn-primary { background: #4a6fa5; color: #fff; }
.btn-ghost { background: #fff; color: #4a6fa5; border: 1.5px solid #c6d3e4; flex: 0 0 auto; padding: 13px 18px; }
.btn-warn { background: #fff; color: #b05a4a; border: 1.5px solid #e3c4bb; flex: 0 0 auto; padding: 13px 16px; }
.btn-block { display: block; width: 100%; margin-bottom: 12px; }
.btn-small { padding: 8px 14px; font-size: 14px; border-radius: 9px; }

/* ===== 首页 ===== */
.home { padding: 26px 22px; overflow-y: auto; }
.app-name { font-size: 26px; font-weight: 700; letter-spacing: 2px; color: #3a3733; }
.app-sub { font-size: 13px; color: #9a938a; margin: 6px 0 20px; }
.notice {
  background: #fff; border: 1px solid #e7e2d8; border-radius: 14px;
  padding: 14px 16px; font-size: 13px; line-height: 1.75; color: #6b665f; margin-bottom: 22px;
}
.notice b { color: #4a4640; }
.notice .warn { color: #b05a4a; }

/* ===== 内容区 ===== */
.content { font-size: 18px; line-height: 1.95; color: #33302b; overflow: hidden; flex: 1; }
.content.op-content { font-size: 16px; line-height: 1.85; color: #5a554e; }
.sentence { display: block; }
.sentence.done { color: #b3aca0; }
.sentence.cur { color: #1f4e79; font-weight: 600; }
.op-tag {
  display: inline-block; font-size: 12px; color: #9a8a5a; background: #f3ecd9;
  border-radius: 6px; padding: 1px 8px; margin-bottom: 10px; letter-spacing: 1px;
}
.auto-tip { font-size: 12px; color: #9a938a; margin-top: 12px; text-align: center; }

/* ===== 朗读进度 ===== */
.voice-bar { flex-shrink: 0; margin-bottom: 14px; }
.voice-status { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #9a938a; margin-bottom: 6px; }
.voice-status .status-left { display: flex; align-items: center; min-width: 0; }
.voice-status .st { color: #4a6fa5; white-space: nowrap; }
.voice-status .st.off { color: #b05a4a; }
.prog-track { height: 7px; border-radius: 4px; background: #e7e2d8; overflow: hidden; }
.prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7d9ec7, #4a6fa5); border-radius: 4px; transition: width .3s; }

/* 识别活动指示：圆点呼吸 + 进度条流动，让朗读者直观知道是否在识别 */
.voice-status .dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: #cfc8bb; margin-right: 6px; flex-shrink: 0;
}
.voice-status .dot.live { background: #5f9e6a; animation: dotPulse 1.4s ease-in-out infinite; }
.voice-status .dot.idle { background: #d99b7e; }
@keyframes dotPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .3; transform: scale(.7); } }
.prog-fill.live {
  background-color: #4a6fa5;
  background-image: linear-gradient(90deg, rgba(255,255,255,.26) 25%, rgba(255,255,255,0) 25%,
    rgba(255,255,255,0) 50%, rgba(255,255,255,.26) 50%,
    rgba(255,255,255,.26) 75%, rgba(255,255,255,0) 75%);
  background-size: 18px 18px;
  animation: progFlow 1s linear infinite;
}
@keyframes progFlow { from { background-position: 0 0; } to { background-position: 18px 0; } }
.voice-heard {
  font-size: 11px; color: #a8a196; margin-top: 6px; line-height: 1.5;
  min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ===== 表单 ===== */
.form-row { margin-bottom: 16px; }
.form-row label { display: block; font-size: 14px; color: #6b665f; margin-bottom: 7px; font-weight: 600; }
.form-row input, .form-row textarea {
  width: 100%; border: 1.5px solid #ddd6c9; border-radius: 12px; padding: 12px 14px;
  font-size: 16px; background: #fff; color: #2c2a26; font-family: inherit; outline: none;
}
.form-row input:focus { border-color: #4a6fa5; }

/* ===== 问答 ===== */
.q-text { font-size: 19px; line-height: 1.8; color: #33302b; margin-bottom: 18px; font-weight: 500; }
.q-hint { font-size: 13px; color: #9a938a; margin-bottom: 14px; }
.opts { display: flex; flex-direction: column; gap: 11px; }
.opt-btn {
  border: 1.5px solid #ddd6c9; background: #fff; border-radius: 13px;
  padding: 14px 16px; font-size: 17px; color: #33302b; text-align: left; cursor: pointer;
}
.opt-btn.picked { border-color: #4a6fa5; background: #eef3f9; color: #1f4e79; font-weight: 600; }
.opt-btn:active { transform: scale(.98); }
.score-row { margin-bottom: 14px; }
.score-row .score-name { font-size: 15px; font-weight: 600; color: #4a4640; margin-bottom: 8px; }
.score-opts { display: flex; flex-wrap: wrap; gap: 7px; }
.score-opts button {
  width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid #ddd6c9;
  background: #fff; font-size: 14px; color: #5a554e; cursor: pointer;
}
.score-opts button.picked { background: #4a6fa5; border-color: #4a6fa5; color: #fff; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 18px; }
.chip {
  border: 1.5px solid #ddd6c9; background: #fff; border-radius: 20px;
  padding: 9px 18px; font-size: 15px; color: #5a554e; cursor: pointer;
}
.chip.on { background: #4a6fa5; border-color: #4a6fa5; color: #fff; font-weight: 600; }

/* ===== 结果/量表 ===== */
.big-result { text-align: center; padding: 30px 10px; }
.big-result .num { font-size: 44px; font-weight: 700; color: #4a6fa5; }
.big-result .num.red { color: #b05a4a; }
.big-result .lab { font-size: 15px; color: #6b665f; margin-top: 4px; }
.big-result .sub { font-size: 13px; color: #9a938a; margin-top: 14px; line-height: 1.7; }
.cmp-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 16px; }
.cmp-table th, .cmp-table td { border: 1px solid #e0dacd; padding: 9px 8px; text-align: center; }
.cmp-table th { background: #efeadf; color: #4a4640; font-weight: 600; }
.cmp-table td:first-child { text-align: left; }
.cmp-table .down { color: #2e7d4f; font-weight: 600; }
.cmp-table .up { color: #b05a4a; font-weight: 600; }
.detail-box { background: #fff; border: 1px solid #e7e2d8; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.detail-box h4 { font-size: 13px; color: #9a938a; margin-bottom: 6px; }
.detail-box p { font-size: 14px; color: #5a554e; line-height: 1.7; }

/* ===== 记录页 ===== */
.rec-list { overflow-y: auto; padding: 14px 16px; }
.rec-item {
  background: #fff; border: 1px solid #e7e2d8; border-radius: 13px;
  padding: 14px 16px; margin-bottom: 11px; cursor: pointer;
}
.rec-item .t { font-size: 15px; font-weight: 600; color: #33302b; }
.rec-item .m { font-size: 12.5px; color: #9a938a; margin-top: 4px; }
.rec-detail { overflow-y: auto; padding: 16px 18px; }
.rec-group { margin-bottom: 14px; }
.rec-group h4 { font-size: 13px; color: #9a8a5a; margin-bottom: 5px; }
.rec-group .r { font-size: 14px; color: #5a554e; line-height: 1.65; }
.section-title { font-size: 17px; font-weight: 700; color: #3a3733; margin: 18px 0 10px; }
textarea.csv-fallback {
  width: 100%; height: 260px; font-size: 11px; font-family: Menlo, monospace;
  border: 1px solid #ddd6c9; border-radius: 10px; padding: 10px; background: #fff; color: #333;
}

/* ===== 顶部提示条 ===== */
.banner {
  background: #fdf3e7; color: #a06b2a; font-size: 12.5px; line-height: 1.6;
  padding: 8px 14px; border-bottom: 1px solid #f0e0c8; flex-shrink: 0;
}
.done-hero { text-align: center; padding: 44px 20px 20px; }
.done-hero .icon { font-size: 52px; }
.done-hero h2 { font-size: 22px; color: #3a3733; margin: 12px 0 6px; }
.done-hero p { font-size: 14px; color: #9a938a; }

/* ===== 2.5 信息加载计时 ===== */
.run-timer {
  margin-top: 6px; font-size: 13px; font-weight: 700; letter-spacing: .5px;
  color: #4a6fa5; font-variant-numeric: tabular-nums;
}
.run-timer.done { color: #c0392b; }

/* ===== 步骤 12.3 回显催眠前（1.4.3）分数 ===== */
.pre-echo {
  border: 1px dashed #d8cfbc; background: #fbf8f1; border-radius: 10px;
  padding: 10px 12px; margin: 8px 0 12px;
}
.pre-echo-t { font-size: 12.5px; color: #9a8a5a; font-weight: 700; margin-bottom: 6px; }
.pre-echo-empty { font-size: 13px; color: #a49c90; }
.pre-echo-note { font-size: 12px; color: #a49c90; margin-top: 6px; line-height: 1.5; }
.pre-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pre-chip {
  font-size: 13px; color: #7a736a; background: #efeade; border: 1px solid #e0d8c6;
  border-radius: 14px; padding: 4px 10px;
}

/* ===== 来访者状态：分组选项 + 滚动 ===== */
.state-scroll {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-right: 2px; margin-top: 4px;
}
.chip-group { margin-bottom: 15px; }
.chip-group-t {
  font-size: 12.5px; font-weight: 700; color: #9a8a5a;
  margin-bottom: 7px; letter-spacing: .5px;
}
/* 选项变多后收紧 chip 尺寸，保证一屏能放下更多 */
.state-scroll .chips { gap: 7px; margin-bottom: 0; }
.state-scroll .chip { padding: 7px 14px; font-size: 14px; border-radius: 16px; }
.state-scroll .score-area { margin-top: 18px; }

/* ===== 「其他」自定义状态项 ===== */
.other-box {
  border: 1px dashed #d8cfbc; background: #fdfaf4; border-radius: 12px;
  padding: 12px 13px; margin: 12px 0 6px;
}
.other-t { font-size: 12.5px; font-weight: 700; color: #9a8a5a; margin-bottom: 10px; line-height: 1.5; }
.other-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.other-input {
  flex: 1; min-width: 0; border: 1.5px solid #ddd6c9; border-radius: 11px;
  padding: 10px 13px; font-size: 16px; background: #fff; color: #2c2a26;
  font-family: inherit; outline: none;
}
.other-input:focus { border-color: #4a6fa5; }
.other-del {
  flex: none; width: 34px; height: 34px; border: 1px solid #e0d8c6; border-radius: 9px;
  background: #fff; color: #a49c90; font-size: 19px; line-height: 1; cursor: pointer;
}
.other-add {
  margin-top: 8px; padding: 7px 13px; font-size: 13px; color: #4a6fa5;
  background: #fff; border: 1px dashed #b9c9e0; border-radius: 14px; cursor: pointer;
}
.other-box .score-row { margin-top: 2px; margin-bottom: 12px; }
.other-box .score-name { font-size: 14px; }

/* ===== 访问密码门 ===== */
.gate {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  background: linear-gradient(160deg, #f6f4ef, #ece6da); padding: 24px;
  box-sizing: border-box;
}
.gate-title { font-size: 24px; font-weight: 800; color: #3a3733; letter-spacing: 1px; }
.gate-sub { font-size: 14px; color: #8a8276; margin-bottom: 6px; }
.gate-input {
  width: 100%; max-width: 320px; border: 1.5px solid #ddd6c9; border-radius: 13px;
  padding: 13px 16px; font-size: 17px; background: #fff; color: #2c2a26;
  font-family: inherit; outline: none; text-align: center;
}
.gate-input:focus { border-color: #4a6fa5; }
.gate-err { min-height: 18px; font-size: 13px; color: #c0392b; }
.gate-btn {
  width: 100%; max-width: 320px; border: none; border-radius: 13px;
  padding: 13px; font-size: 17px; font-weight: 700; color: #fff;
  background: #4a6fa5; cursor: pointer; font-family: inherit;
}
.gate-btn:active { background: #3d5d8a; }

</style>

/* 文本归一化：去空格 → 删括号对及内容 → 去中英标点 → 小写 */
var Normalize = (function () {
  var PUNCT = /[\s，。、；：？！“”‘’…—·~～\[\]【】《》〈〉"'’,.;:!?()（）•・→➡️①②③④⑤]/g;

  function stripBrackets(s) {
    var prev = null;
    while (prev !== s) {
      prev = s;
      s = s.replace(/（[^（）]*）/g, '').replace(/\([^()]*\)/g, '');
    }
    return s;
  }

  function norm(s) {
    if (!s) return '';
    s = stripBrackets(s);
    s = s.replace(PUNCT, '');
    return s.toLowerCase();
  }

  return { norm: norm };
})();

/*
 * 覆盖率算法：有序分块指针匹配（ordered chunk-pointer with bigram similarity）
 * - 输入 sentences: [{ idx, text }]（与分页引擎同源，一句 = 一个 chunk）
 * - cursor 只前进：识别文本能覆盖当前窗口 [cursor, cursor+2] 内某 chunk 即推进
 *   （有序 → 后文不能伪标前文；增量 → 暂停/重启天然不清零）
 * - 匹配条件：chunk 的 bigram 对识别全文的包含率 ≥ 0.8，
 *   或 chunk 与识别文本尾部（近140字）的 Dice 系数 ≥ 0.55（容忍同音字/局部插入）
 */
var Coverage = (function (N) {

  function bigrams(s) {
    var m = {};
    for (var i = 0; i + 1 < s.length; i++) {
      var b = s.substr(i, 2);
      m[b] = (m[b] || 0) + 1;
    }
    return m;
  }

  function containment(bigA, bigB) { // |A∩B| / |A|
    var hit = 0, total = 0;
    for (var k in bigA) { total += bigA[k]; hit += Math.min(bigA[k], bigB[k] || 0); }
    return total ? hit / total : 0;
  }

  function dice(bigA, bigB) {
    var inter = 0, a = 0, b = 0, k;
    for (k in bigA) { a += bigA[k]; inter += Math.min(bigA[k], bigB[k] || 0); }
    for (k in bigB) { b += bigB[k]; }
    return (a + b) ? (2 * inter / (a + b)) : 0;
  }

  // 字符多重集包含率：识别文本能覆盖 chunk 多少比例的字符（容忍漏字/同音字）
  function charContain(norm, text) {
    if (!norm) return 0;
    var cnt = {}, i;
    for (i = 0; i < text.length; i++) cnt[text[i]] = (cnt[text[i]] || 0) + 1;
    var hit = 0;
    for (i = 0; i < norm.length; i++) {
      if (cnt[norm[i]] > 0) { cnt[norm[i]]--; hit++; }
    }
    return hit / norm.length;
  }

  function Tracker(sentences) { // sentences: [{idx, text}]，text 为原文
    var self = this;
    this.chunks = [];
    this.cursor = 0;
    this.coveredChars = 0;
    this.sentenceCount = sentences.length;
    sentences.forEach(function (s) {
      var n = N.norm(s.text);
      self.chunks.push({ senIdx: s.idx, norm: n, bigrams: n ? bigrams(n) : null, len: n.length });
    });
    this.totalChars = this.chunks.reduce(function (a, c) { return a + c.len; }, 0);
  }

  Tracker.prototype.feed = function (cumulativeText) {
    var text = N.norm(cumulativeText || '');
    if (!text || !this.totalChars) return this.progress();
    var bigText = bigrams(text);
    var tail = text.length > 140 ? text.slice(-140) : text;
    var bigTail = bigrams(tail);
    var guard = 0;
    while (guard++ < 5) {
      var matched = false;
      for (var w = 0; w < 3 && this.cursor + w < this.chunks.length; w++) {
        var c = this.chunks[this.cursor + w];
        if (!c.bigrams || !c.len) { // 空句（纯括号/标点）直接跳过
          if (this.cursor + w === this.cursor) { this.cursor = this.cursor + w + 1; matched = true; }
          continue;
        }
        if (containment(c.bigrams, bigText) >= 0.8 ||
            charContain(c.norm, text) >= 0.75 ||
            dice(c.bigrams, bigTail) >= 0.55) {
          this.coveredChars += c.len;
          this.cursor = this.cursor + w + 1;
          matched = true;
          break;
        }
      }
      if (!matched) break;
    }
    return this.progress();
  };

  Tracker.prototype.progress = function () {
    return this.totalChars ? this.coveredChars / this.totalChars : 0;
  };

  Tracker.prototype.doneAll = function () { return this.cursor >= this.chunks.length; };

  // 当前应朗读到的句子 idx（用于卡拉OK高亮）
  Tracker.prototype.currentSentence = function () {
    var c = this.chunks[Math.min(this.cursor, this.chunks.length - 1)];
    return c ? c.senIdx : 0;
  };

  return { Tracker: Tracker };
})(Normalize);


/* ===== src/core/pager.js ===== */
/*
 * 动态分页引擎：句子级测量式分页（无内部滚动约束）
 * 把句子逐个放入与真实内容区同尺寸/同样式的隐形测量层，
 * scrollHeight 溢出即切屏。fonts.ready / resize 后由调用方重算。
 */
var Pager = (function () {

  /*
   * paginate(sentences, mount, maxH)
   *  - sentences: [{ idx, text }]
   *  - mount(nodeFactory): 调用方提供「创建隐形测量节点」的函数，
   *    返回已插入 DOM（与内容区同宽同字体）的元素
   *  - maxH: 内容区可用高度（px）
   * 返回 screens: [{ from, to }]（句子 idx 闭区间）
   */
  function paginate(sentences, mount, maxH) {
    var el = mount();
    var screens = [];
    var start = 0;
    var count = 0;
    for (var i = 0; i < sentences.length; i++) {
      var span = document.createElement('span');
      span.className = 'sentence';
      span.textContent = sentences[i].text;
      el.appendChild(span);
      count++;
      if (el.scrollHeight > maxH && count > 1) {
        el.removeChild(el.lastChild);
        screens.push({ from: start, to: sentences[i - 1].idx });
        el.innerHTML = '';
        el.appendChild(span);
        start = sentences[i].idx;
        count = 1;
      }
    }
    if (start <= sentences[sentences.length - 1].idx) {
      screens.push({ from: start, to: sentences[sentences.length - 1].idx });
    }
    if (el && el.parentNode) el.parentNode.removeChild(el);
    return screens;
  }

  return { paginate: paginate };
})();


/* ===== src/core/store.js ===== */
/* localStorage 会话仓库：会话列表 + 进行中快照 */
var Store = (function () {
  var SKEY = 'hyp_sessions_v1';
  var CKEY = 'hyp_current_v1';
  var MAX = 50;

  function read(k, d) {
    try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }
    catch (e) { return d; }
  }
  function write(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { return false; }
  }

  return {
    list: function () { return read(SKEY, []); },
    save: function (s) {
      var a = read(SKEY, []);
      var i = -1;
      for (var j = 0; j < a.length; j++) if (a[j].id === s.id) { i = j; break; }
      if (i >= 0) a[i] = s; else a.unshift(s);
      if (a.length > MAX) a = a.slice(0, MAX);
      write(SKEY, a);
    },
    get: function (id) {
      var a = read(SKEY, []);
      for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
      return null;
    },
    remove: function (id) {
      var a = read(SKEY, []).filter(function (x) { return x.id !== id; });
      write(SKEY, a);
    },
    snapshot: function (s) { write(CKEY, s); },
    loadSnapshot: function () { return read(CKEY, null); },
    clearSnapshot: function () { try { localStorage.removeItem(CKEY); } catch (e) {} }
  };
})();


/* ===== src/core/asr.js ===== */
/*
 * Web Speech API 封装
 * - 微信内置浏览器（MicroMessenger）直接降级：实例可建但 onresult 永不触发
 * - continuous=false + interimResults=true + onend 自动重启（比 Safari 的 continuous 稳）
 * - 识别会话与「朗读进度」解耦：进度由调用方的 Coverage.Tracker 持有，重启不触碰
 * - watchdog：watchdogMs 无任何识别结果 → 阶梯重启；连续失败超限 → 永久降级手动
 * - 不录音、不保存音频；识别文本仅存内存缓冲，朗读单元结束即弃
 */
var ASR = (function () {

  function isWeChat() { return /MicroMessenger/i.test(navigator.userAgent); }
  function srClass() { return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
  function supported() { return !!srClass(); }
  function available() { return supported() && !isWeChat(); }

  // 是否适合 continuous=true
  // 背景：浏览器每次 rec.start() 都会发出一次系统提示音（"叮/滴"）。
  // continuous=false 时，每说完一句就 onend → 重启 → 再响一次，催眠场景会变成连续滴滴。
  // Chrome / Edge / Android 的 continuous 表现稳定，一次会话可持续很久，提示音只响一次；
  // Safari / iOS（WebKit）的 continuous 有已知问题（不回调、提前结束），继续保持"短会话+重启"策略。
  function prefersContinuous() {
    var ua = navigator.userAgent || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);
    var isSafari = /Safari/i.test(ua) && !/Chrome|Chromium|Edg|Android/i.test(ua);
    return !(isIOS || isSafari);
  }

  function Manager(opts) {
    this.opts = opts || {}; // { lang, onResult(cumText), onStatus(s), onDegrade(reason, hard) }
    this.SR = srClass();
    this.active = false;
    this.degraded = false;
    this.baseFinal = '';   // 已结束识别会话的最终文本累计
    this.sessionFinal = '';
    this.rec = null;
    this.lastResultTs = 0;
    this.sessionStartedAt = 0; // 当前识别会话的起始时间（用于看门狗判静默，避免催眠长停顿被误杀）
    this.startedAt = 0;
    this.failStreak = 0;
    this.hold = false;        // true = 覆盖率已达标，暂停一切重启（每次 start() 都是一次系统提示音）
    this.watchdogTimer = null;
    this.restartTimer = null;
    this.continuousMode = false;  // 由 _create() 按浏览器能力确定
  }

  Manager.prototype._emit = function (status) {
    if (this.opts.onStatus) this.opts.onStatus(status);
  };

  Manager.prototype._cum = function (finals, interim) {
    return this.baseFinal + finals + (interim || '');
  };

  Manager.prototype._create = function () {
    var self = this;
    var r = new this.SR();
    // continuous：能开就开，避免频繁 start() 造成的连续系统提示音
    var cont = (this.opts.continuous != null) ? !!this.opts.continuous : prefersContinuous();
    this.continuousMode = cont;
    r.continuous = cont;
    r.interimResults = true;
    r.lang = this.opts.lang || 'zh-CN';
    r.onresult = function (e) {
      self.lastResultTs = Date.now();
      self.failStreak = 0;
      var finals = '', interim = '';
      for (var i = 0; i < e.results.length; i++) {
        var t = e.results[i][0].transcript || '';
        if (e.results[i].isFinal) finals += t; else interim += t;
      }
      self.sessionFinal = finals;
      self._emit('listening');
      if (self.opts.onResult) self.opts.onResult(self._cum(finals, interim));
    };
    r.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        self._degrade('麦克风权限被拒绝', true);   // hard: 永久手动模式
      }
    };
    r.onend = function () {
      if (!self.active || self.degraded) return;
      self.baseFinal += self.sessionFinal;
      self.sessionFinal = '';
      self._restartSoon(250);
    };
    return r;
  };

  Manager.prototype._restartSoon = function (delay) {
    var self = this;
    if (this.restartTimer) clearTimeout(this.restartTimer);
    this.restartTimer = setTimeout(function () {
      if (!self.active || self.degraded) return;
      self._spawn();
    }, delay || 250);
  };

  Manager.prototype._spawn = function () {
    var self = this;
    if (!this.active || this.degraded) return;
    try {
      this.rec = this._create();
      this.rec.start();
      this.sessionStartedAt = Date.now();  // 记录本次会话起点，催眠中的长停顿会被每次重启刷新
      this._emit('listening');
    } catch (e) {
      this._restartSoon(600);
    }
  };

  Manager.prototype._degrade = function (reason, hard) {
    if (this.degraded) return;
    this.degraded = true;
    this.active = false;
    this._teardown();
    this._emit('off');
    if (this.opts.onDegrade) this.opts.onDegrade(reason, !!hard);
  };

  Manager.prototype._teardown = function () {
    if (this.watchdogTimer) { clearInterval(this.watchdogTimer); this.watchdogTimer = null; }
    if (this.restartTimer) { clearTimeout(this.restartTimer); this.restartTimer = null; }
    if (this.rec) {
      try { this.rec.onresult = null; this.rec.onend = null; this.rec.onerror = null; this.rec.stop(); } catch (e) {}
      this.rec = null;
    }
  };

  Manager.prototype._watchdog = function () {
    var self = this;
    // 连续模式下会话会长期存活，若沿用"距上次结果 6s 就重启"，静默期会被反复重启（每次都是一次提示音）。
    // 因此连续模式改用更长的观察窗，且仅以"最后一次识别结果"为基准（会话存活不应被当作 idle）。
    var ms = this.continuousMode
      ? (this.opts.continuousWatchdogMs || 60000)
      : (this.opts.watchdogMs || 6000);
    this.watchdogTimer = setInterval(function () {
      if (!self.active || self.degraded) return;
      if (self.hold) return;   // 已达标：不再重启，避免额外提示音
      // 短会话模式：取"最后一次成功识别"和"当前会话起点"的较新者（会话不断重启会刷新 sessionStartedAt，避免误判）
      // 连续模式：会话长期存活，只看最后一次识别结果
      var ref = self.continuousMode
        ? ((self.lastResultTs || 0) || self.sessionStartedAt || self.startedAt)
        : (Math.max(self.lastResultTs || 0, self.sessionStartedAt || 0) || self.startedAt);
      var idle = Date.now() - ref;
      if (idle > ms) {
        self.failStreak++;
        // 软故障：永不永久降级，仅按阶梯延迟重启；用户恢复说话即可继续识别
        // 永久降级只留给"硬错误"（onerror not-allowed / service-not-allowed / 环境不支持）
        var ladder = [300, 1000, 2000, 3500];
        var d = ladder[Math.min(self.failStreak - 1, ladder.length - 1)];
        if (self.rec) { try { self.rec.onend = null; self.rec.stop(); } catch (e) {} }
        self._restartSoon(d);
      }
    }, 2000);
  };

  // 开始一次朗读识别（进度累计归零由调用方通过新建 Tracker 完成）
  Manager.prototype.start = function () {
    if (this.degraded || !available()) return false;
    this.stop();
    this.active = true;
    this.baseFinal = '';
    this.sessionFinal = '';
    this.lastResultTs = 0;
    this.startedAt = Date.now();
    this.failStreak = 0;
    this.hold = false;
    this._spawn();
    this._watchdog();
    return true;
  };

  // 暂停（保留已识别文本，不归零调用方进度）
  Manager.prototype.pause = function () {
    if (this.rec) {
      this.baseFinal += this.sessionFinal;
      this.sessionFinal = '';
    }
    this.active = false;
    this._teardown();
    this._emit('paused');
  };

  // 恢复（保留 baseFinal 继续累计）
  Manager.prototype.resume = function () {
    if (this.degraded || this.active) return !!this.active;
    this.active = true;
    this.startedAt = Date.now();
    this._spawn();
    this._watchdog();
    return true;
  };

  Manager.prototype.stop = function () {
    this.active = false;
    this._teardown();
  };

  Manager.prototype.reset = function () { // 朗读单元切换：清空识别文本
    this.baseFinal = '';
    this.sessionFinal = '';
  };

  // 麦克风权限预热：在用户手势中调用，避免进入朗读页才弹权限
  function warmup(cb) {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
        s.getTracks().forEach(function (t) { t.stop(); });
        cb && cb(true);
      }).catch(function () { cb && cb(false); });
    } else {
      cb && cb(null);
    }
  }

  // ---- 常驻麦克风（实验：尝试抑制系统提示音）----
  // 思路：提示音是系统在「麦克风由关变开」的瞬间发出的。若全程保持一条 getUserMedia 音频流，
  // 麦克风指示灯常亮，部分 iOS/Android 版本在识别启动时就不再重复发声。
  // 注意：个别版本会出现「识别无结果」的冲突，因此仅作为可关闭的实验开关。
  var heldStream = null;
  function hasMicHold() { return !!heldStream; }
  function holdMic(cb) {
    if (heldStream) { cb && cb(true); return; }
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { cb && cb(false); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      heldStream = s;
      cb && cb(true);
    }).catch(function () { cb && cb(false); });
  }
  function releaseMic() {
    if (!heldStream) return;
    try { heldStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    heldStream = null;
  }

  return {
    isWeChat: isWeChat,
    supported: supported,
    available: available,
    warmup: warmup,
    holdMic: holdMic,
    releaseMic: releaseMic,
    hasMicHold: hasMicHold,
    Manager: Manager
  };
})();


/* ===== src/core/csv.js ===== */
/* CSV 生成与导出（BOM + UTF-8 + CRLF，Excel 直开无乱码；微信内降级为复制） */
var CSV = (function () {

  function esc(v) {
    v = (v === null || v === undefined) ? '' : String(v);
    return '"' + v.replace(/"/g, '""') + '"';
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function fmtTs(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function build(session, scores) {
    var rows = [];
    rows.push(['会话编号', '开始时间', '流程名称', '受访者姓名', '催眠目标',
      '步骤/分组', '问题', '答案类型', '答案', '记录时间']);
    (session.records || []).forEach(function (r) {
      rows.push([session.id, fmtTs(session.startTime), session.flowTitle,
        session.clientName || '', session.goal || '', r.group || '', r.question || '',
        r.answerType || '', (r.answer === null || r.answer === undefined) ? '' : String(r.answer),
        fmtTs(r.ts || session.startTime)]);
    });
    if (scores) {
      rows.push([]);
      rows.push(['汇总']);
      var s = scores;
      rows.push(['问卷得分', '暗示感受性问卷(一)', '', '分数', s.q1 === null ? '跳过' : s.q1]);
      rows.push(['问卷得分', '暗示感受性问卷(二)', '', '分数', s.q2 === null ? '跳过' : s.q2]);
      if (s.qTotal !== null) {
        rows.push(['问卷得分', '暗示感受性总分', '', '分数', s.qTotal]);
        rows.push(['问卷结果', '躯体型暗示感受性', '', '比例', Math.round(s.somaticPct * 100) + '%']);
        rows.push(['问卷结果', '情绪型暗示感受性', '', '比例', Math.round(s.emotionalPct * 100) + '%']);
      }
      [['BDC 量表总分', s.bdc], ['BAI 量表总分', s.bai],
       ['情绪状态评分合计', s.state && s.state.emotion], ['身体状态评分合计', s.state && s.state.body]
      ].forEach(function (pair) {
        var v = pair[1] || {};
        rows.push(['前后对比', pair[0], '', '催眠前', v.pre === null || v.pre === undefined ? '跳过' : v.pre,
          '催眠后', v.post === null || v.post === undefined ? '跳过' : v.post,
          '差异(后-前)', v.delta === null || v.delta === undefined ? '' : v.delta]);
      });
      (s.stateDetails || []).forEach(function (d) {
        rows.push(['状态明细', d.phase === 'pre' ? '催眠前' : '催眠后', d.domain === 'emotion' ? '情绪状态' : '身体状态',
          '第' + d.round + '轮', d.text]);
      });
    }
    return '\uFEFF' + rows.map(function (r) { return r.map(esc).join(','); }).join('\r\n');
  }

  function isWeChat() { return /MicroMessenger/i.test(navigator.userAgent); }

  function download(name, csv, fallbackContainer) {
    if (!isWeChat()) {
      try {
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        return true;
      } catch (e) { /* fallthrough */ }
    }
    // 微信内 / 下载失败：弹 textarea 长按复制
    if (fallbackContainer) {
      fallbackContainer.innerHTML = '';
      var tip = document.createElement('p');
      tip.className = 'q-hint';
      tip.textContent = '当前环境不支持直接下载，请长按下方文本全选复制，粘贴到备忘录/电脑后保存为 .csv（Excel 可直接打开）：';
      var ta = document.createElement('textarea');
      ta.className = 'csv-fallback';
      ta.readOnly = true;
      ta.value = csv;
      fallbackContainer.appendChild(tip);
      fallbackContainer.appendChild(ta);
      return false;
    }
    return false;
  }

  return { build: build, download: download };
})();

      ['emotion', 'body'].forEach(function (domain) {
        var sum = 0, has = false;
        for (var r = 1; r <= FLOW.stateForm.maxRounds; r++) {
          var v = a['state_' + phase + '_' + (domain === 'emotion' ? 'e' : 'b') + r];
          if (v && v.selections) {
            var parts = [];
            for (var name in v.selections) { sum += v.selections[name]; has = true; parts.push(name + ':' + v.selections[name]); }
            if (parts.length) stateDetails.push({ phase: phase, domain: domain, round: r, text: parts.join('，') });
          }
        }
        if (has) state[domain][phase] = sum;
      });
    });
    state.emotion.delta = (state.emotion.pre !== null && state.emotion.post !== null) ? state.emotion.post - state.emotion.pre : null;
    state.body.delta = (state.body.pre !== null && state.body.post !== null) ? state.body.post - state.body.pre : null;

    return { q1: q1, q2: q2, qTotal: qTotal, somaticPct: somaticPct, emotionalPct: somaticPct === null ? null : 1 - somaticPct, bdc: bdc, bai: bai, state: state, stateDetails: stateDetails };
  }

  // ================= 渲染框架 =================
  function render() {
    stopTimers();
    var root = $('#app');
    root.innerHTML = '';
    if (app.view === 'home') renderHome(root);
    else if (app.view === 'run') renderRun(root);
    else if (app.view === 'records') renderRecords(root);
    else if (app.view === 'detail') renderDetail(root);
    else if (app.view === 'done') renderDone(root);
  }

  function stopTimers() {
    if (app.opTimer) { clearTimeout(app.opTimer); app.opTimer = null; }
    if (app.voiceTimer) { clearInterval(app.voiceTimer); app.voiceTimer = null; }
    if (app.tickTimer) { clearInterval(app.tickTimer); app.tickTimer = null; }
    if (app.manager) app.manager.pause();
  }

  function screen(title, posText, bannerText) {
    var root = $('#app');
    var sc = el('div', 'screen');
    if (bannerText) sc.appendChild(el('div', 'banner', bannerText));
    if (title !== null) {
      var hd = el('div', 'hd');
      hd.appendChild(el('div', 'step-title', title));
      if (posText) hd.appendChild(el('div', 'unit-pos', posText));
      sc.appendChild(hd);
    }
    var body = el('div', 'body');
    sc.appendChild(body);
    var ft = el('div', 'ft');
    sc.appendChild(ft);
    root.appendChild(sc);
    return { body: body, ft: ft, hd: hd || null };
  }

  // ================= 首页 =================
  function renderHome(root) {
    var snap = Store.loadSnapshot();
    var hasSnap = !!(snap && snap.session && snap.session.status === 'running');
    var box = el('div', 'home');

    box.appendChild(el('div', 'app-name', FLOW.meta.title));
    box.appendChild(el('div', 'app-sub', '流程引导 · 语音跟读 · 问答记录 · 本机保存'));

    var notice = el('div', 'notice');
    notice.innerHTML = '<b>使用说明</b><br>' +
      '· 按预设顺序逐步展示引导提示：操作提示页停留 1.5 秒自动进入下一页；朗读页跟读识别，覆盖率达 <b>85%</b> 且静音 1.5 秒后自动翻页。<br>' +
      '· 语音识别由您浏览器自带的语音服务完成（部分浏览器会经由 Apple / Google 的语音服务处理音频）；<b>本工具自身不录音、不保存音频和完整识别文字</b>。<br>' +
      '· 识别不可用、权限被拒或嘈杂环境时，可随时点「上一步 / 下一步」<b>手动继续</b>。<br>' +
      '· 所有问答与量表结果仅保存在本机，可随时在「问答记录」中导出 CSV（Excel 可打开）。请定期导出备份。' +
      (ASR.isWeChat() ? '<br><span class="warn">当前在微信内打开：语音识别不可用，将全程手动模式。请点右上角「···」选择「在浏览器打开」以启用语音识别。</span>' :
        (!ASR.supported() ? '<br><span class="warn">当前浏览器不支持语音识别，将全程手动模式。</span>' : '')) +
      (location.protocol === 'file:' ? '<br><span class="warn">提示：直接打开本地文件时语音识别可能不可用，建议通过链接访问。</span>' : '');
    box.appendChild(notice);

    if (hasSnap) {
      var cont = el('button', 'btn btn-primary btn-block',
        '继续上次（' + (snap.session.clientName || '未命名') + ' · ' + fmtTime(snap.session.startTime) + ' · 第' + (snap.unitIndex) + '/' + (UNITS.length - 1) + '步）');
      cont.onclick = function () {
        app.session = snap.session;
        app.unitIndex = snap.unitIndex;
        app.screenIndex = 0;
        app.view = 'run';
        render();
      };
      box.appendChild(cont);
    }

    var start = el('button', 'btn btn-primary btn-block', '开始新流程');
    start.onclick = function () {
      app.session = newSession();
      app.unitIndex = 0;
      app.screenIndex = 0;
      app.loopCount = {};
      app.timerStart = 0;
      app.view = 'run';
      render();
    };
    box.appendChild(start);

    var rec = el('button', 'btn btn-ghost btn-block', '问答记录');
    rec.style.flex = '1';
    rec.onclick = function () { app.view = 'records'; render(); };
    box.appendChild(rec);

    var wrap = el('div', 'screen');
    wrap.appendChild(box);
    root.appendChild(wrap);
  }

  // ================= 执行视图 =================
  function renderRun(root) {
    var unit = UNITS[app.unitIndex];
    if (!unit) return;
    var pos = (app.unitIndex) + ' / ' + (UNITS.length - 1);
    var ui = screen(unit.step || FLOW.meta.title, pos, ASR.isWeChat() ? '微信内打开：语音识别不可用，请点右上角「···」在浏览器中打开' : null);

    // 计时显示（如步骤 2.5 信息加载）：进入计时区间即开始，跨循环累计
    var tlp = timerRangeOf(app.unitIndex);
    if (tlp) {
      if (!app.timerStart) app.timerStart = Date.now();
      var tbox = el('div', 'run-timer');
      ui.hd.appendChild(tbox);
      var paint = function () {
        var ms = elapsedMs();
        tbox.textContent = '已用 ' + fmtClock(ms) + ' / ' + Math.round(tlp.durationMs / 60000) + ' 分钟';
        tbox.className = 'run-timer' + (ms >= tlp.durationMs ? ' done' : '');
      };
      paint();
      app.tickTimer = setInterval(paint, 500);
    }

    if (unit.type === 'intro') renderIntro(ui, unit);
    else if (unit.type === 'op') renderOp(ui, unit);
    else if (unit.type === 'reading') renderReading(ui, unit);
    else if (unit.type === 'qintro') renderQIntro(ui, unit);
    else if (unit.type === 'question') renderQuestion(ui, unit);
    else if (unit.type === 'qresult') renderQResult(ui, unit);
    else if (unit.type === 'stateround') renderStateRound(ui, unit);
    else if (unit.type === 'comparison') renderComparison(ui, unit);
  }

  function navFooter(ui, opts) {
    var ft = ui.ft;
    ft.innerHTML = '';
    var prev = el('button', 'btn btn-ghost', '上一步');
    prev.disabled = app.unitIndex <= 0;
    prev.onclick = function () { gotoUnit(app.unitIndex - 1); };
    ft.appendChild(prev);
    if (opts && opts.extra) opts.extra.forEach(function (b) { ft.appendChild(b); });

    // 跳过：步骤级 skipTo（如 2.6 → 2.7）优先，否则进入下一单元
    if (!(opts && opts.noSkip)) {
      var st = skipTarget();
      var lbl = st ? (st.label || '跳过 ▸') : '跳过';
      var skip = el('button', 'btn btn-warn btn-small', lbl);
      if (lbl.length > 4) { skip.style.flex = '1.6'; skip.style.padding = '8px 8px'; skip.style.fontSize = '13px'; }
      skip.onclick = function () { gotoUnit(st ? st.i : resolveSkip(app.unitIndex)); };
      ft.appendChild(skip);
    }

    var next = el('button', 'btn btn-primary', (opts && opts.nextLabel) || '下一步');
    next.disabled = !!(opts && opts.nextDisabled);
    if (!(opts && opts.hideNext)) {
      next.onclick = function () { if (opts && opts.onNext) opts.onNext(); else nextUnit(); };
      ft.appendChild(next);
    }
    return { next: next };
  }

  function gotoUnit(i) {
    stopTimers();
    if (i >= UNITS.length) return finishSession();
    app.unitIndex = Math.max(0, i);
    app.screenIndex = 0;
    app.userPaused = false;
    app.lastHeard = '';
    snapshot();
    render();
  }

  function nextUnit() { gotoUnit(resolveNext(app.unitIndex)); }

  // ---- 首屏表单 ----
  function renderIntro(ui, unit) {
    var b = ui.body;
    var s = app.session;
    var g1 = el('div', 'form-row');
    g1.appendChild(el('label', '', '受访者姓名'));
    var inName = el('input');
    inName.placeholder = '请输入来访者姓名';
    inName.value = s.clientName || '';
    g1.appendChild(inName);
    var g2 = el('div', 'form-row');
    g2.appendChild(el('label', '', '本次催眠目标'));
    var inGoal = el('textarea');
    inGoal.rows = 3;
    inGoal.placeholder = '例如：缓解考试焦虑；改善睡眠……';
    inGoal.value = s.goal || '';
    g2.appendChild(inGoal);
    b.appendChild(g1);
    b.appendChild(g2);

    // 朗读页翻页方式：默认「静音手动」——不启动麦克风，浏览器不会发出任何提示音
    var modeRow = el('div', 'form-row');
    modeRow.appendChild(el('label', '', '朗读页翻页方式'));
    var modeBox = el('div', 'chips');
    var mManual = el('button', 'chip', '静音手动（无提示音）');
    var mVoice = el('button', 'chip', '语音跟随（有系统提示音）');
    function syncMode() {
      mManual.className = 'chip' + (app.followMode === 'manual' ? ' on' : '');
      mVoice.className = 'chip' + (app.followMode === 'voice' ? ' on' : '');
    }
    mManual.onclick = function () { app.followMode = 'manual'; syncMode(); };
    mVoice.onclick = function () { app.followMode = 'voice'; syncMode(); };
    syncMode();
    modeBox.appendChild(mManual);
    modeBox.appendChild(mVoice);
    modeRow.appendChild(modeBox);
    b.appendChild(modeRow);

    // 实验开关：常驻麦克风（部分系统可借此消除重复提示音，个别版本可能与识别冲突）
    var quietRow = el('div', 'form-row');
    var qChip = el('button', 'chip' + (app.micHold ? ' on' : ''), '实验：常驻麦克风，尝试抑制提示音');
    qChip.onclick = function () {
      app.micHold = !app.micHold;
      qChip.className = 'chip' + (app.micHold ? ' on' : '');
      if (app.micHold) ASR.holdMic(function () {});
      else ASR.releaseMic();
    };
    quietRow.appendChild(qChip);
    b.appendChild(quietRow);

    b.appendChild(el('p', 'q-hint', '麦克风提示音由浏览器/系统发出，网页没有接口可以关闭它。默认「语音跟随」会正常识别并自动翻页；只有选「静音手动」才能保证全程零声音。上面的实验开关会全程保持麦克风常开，部分系统可借此消除重复提示音，若发现识别无反应请关掉它。'));

    b.appendChild(el('p', 'q-hint', '两项均填写后点击「开始流程」。内容将保存在本机会话中并随 CSV 导出。'));

    var skipBtn = el('button', 'btn btn-warn btn-small', '跳过');
    skipBtn.onclick = function () {
      s.clientName = inName.value.trim() || '（未填写）';
      s.goal = inGoal.value.trim() || '（未填写）';
      setRecord('intro', '基本信息', '受访者姓名', '文本', s.clientName);
      setRecord('intro_goal', '基本信息', '本次催眠目标', '文本', s.goal);
      saveSession();
      toast('已跳过基本信息填写');
      nextUnit();
    };

    var nav = navFooter(ui, {
      nextLabel: '开始流程', nextDisabled: true, noSkip: true, extra: [skipBtn], onNext: function () {
        s.clientName = inName.value.trim();
        s.goal = inGoal.value.trim();
        setRecord('intro', '基本信息', '受访者姓名', '文本', s.clientName);
        setRecord('intro_goal', '基本信息', '本次催眠目标', '文本', s.goal);
        saveSession();
        // 用户手势内预热麦克风权限
        if (ASR.available()) ASR.warmup();
        nextUnit();
      }
    });
    function check() { nav.next.disabled = !(inName.value.trim() && inGoal.value.trim()); }
    inName.oninput = check; inGoal.oninput = check; check();
  }

  // ---- 测量式分页 ----
  function measureMount(contentCls) {
    var bodyEl = $('.body');
    var m = el('div', 'content ' + (contentCls || ''));
    m.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;width:' +
      (bodyEl.clientWidth - 40) + 'px;';
    bodyEl.appendChild(m);
    return { el: m, maxH: bodyEl.clientHeight - 36 };
  }

  function paginateSentences(sentences, contentCls, reserveH) {
    var mm = measureMount(contentCls);
    var maxH = mm.maxH - (reserveH || 0);
    try {
      return Pager.paginate(sentences, function () { return mm.el; }, maxH);
    } finally {
      if (mm.el.parentNode) mm.el.parentNode.removeChild(mm.el);
    }
  }

  // ---- 操作提示页 ----
  function renderOp(ui, unit) {
    var b = ui.body;
    var sentences = splitSentences(unit.texts.length ? unit.texts : [unit.step || '']);
    var screens = paginateSentences(sentences, 'op-content', 0);
    var scr = screens[Math.min(app.screenIndex, screens.length - 1)];

    var c = el('div', 'content op-content');
    c.appendChild(el('span', 'op-tag', '操作提示'));
    for (var i = scr.from; i <= scr.to; i++) {
      var sp = el('span', 'sentence', sentences[i].text);
      c.appendChild(sp);
    }
    if (screens.length > 1) {
      c.appendChild(el('span', 'auto-tip', '（第' + (app.screenIndex + 1) + '/' + screens.length + '屏）'));
    }
    c.appendChild(el('span', 'auto-tip', (OP_DELAY / 1000) + ' 秒后自动进入下一页，可点击下一步跳过'));
    b.appendChild(c);

    navFooter(ui, {
      nextLabel: screens.length > 1 && app.screenIndex < screens.length - 1 ? '下一屏' : '下一步',
      onNext: function () {
        if (app.screenIndex < screens.length - 1) { app.screenIndex++; render(); }
        else nextUnit();
      }
    });

    app.opTimer = setTimeout(function () {
      if (app.screenIndex < screens.length - 1) { app.screenIndex++; render(); }
      else nextUnit();
    }, OP_DELAY);
  }

  // ---- 朗读页 ----
  function renderReading(ui, unit) {
    var b = ui.body;
    var manual = (app.followMode === 'manual');  // 静音模式：不启动麦克风 → 零提示音
    var sentences = splitSentences(unit.texts);
    var reserveH = 84; // voice-bar 高度（状态行 + 进度条 + 听到的文本行）
    var screens = paginateSentences(sentences, '', reserveH);
    if (app.screenIndex >= screens.length) app.screenIndex = screens.length - 1;
    var scr = screens[app.screenIndex];

    // 语音状态条：呼吸灯 + 覆盖率进度条 + 最近识别到的文本
    var bar = el('div', 'voice-bar');
    var status = el('div', 'voice-status');
    var left = el('div', 'status-left');
    var dot = el('span', 'dot');
    var st = el('span', 'st', '');
    left.appendChild(dot);
    left.appendChild(st);
    var pct = el('span', '', '0%');
    status.appendChild(left);
    status.appendChild(pct);
    var track = el('div', 'prog-track');
    var fill = el('div', 'prog-fill');
    track.appendChild(fill);
    var heard = el('div', 'voice-heard', '');
    bar.appendChild(status);
    bar.appendChild(track);
    bar.appendChild(heard);

    var c = el('div', 'content');
    for (var i = scr.from; i <= scr.to; i++) {
      c.appendChild(el('span', 'sentence', sentences[i].text));
    }
    b.appendChild(bar);
    b.appendChild(c);
    if (manual) {
      c.appendChild(el('span', 'auto-tip', '静音模式：读完本屏点下方「下一屏 / 下一步」'));
    }

    // 按钮
    var pauseBtn = el('button', 'btn btn-ghost btn-small', '暂停');
    pauseBtn.onclick = function () {
      if (app.userPaused) {
        app.userPaused = false;
        pauseBtn.textContent = '暂停';
        if (app.manager && !app.manager.degraded) app.manager.resume();
      } else {
        app.userPaused = true;
        pauseBtn.textContent = '继续';
        if (app.manager) app.manager.pause();
      }
    };
    // 「重新识别」默认隐藏，仅在「识别不到」时才出现
    var restartBtn = el('button', 'btn btn-ghost btn-small', '重新识别');
    restartBtn.style.display = 'none';
    restartBtn.onclick = function () {
      if (!app.manager || !ASR.available()) {
        toast(ASR.isWeChat() ? '微信内不支持语音识别，请在浏览器中打开' : '当前环境不支持语音识别');
        return;
      }
      app.manager.degraded = false;   // 允许手动重试（含 watchdog 永久降级之后）
      app.asrDegraded = false;
      app.manager.reset();
      app.userPaused = false;
      pauseBtn.textContent = '暂停';
      app.manager.start();
      app.lastHeard = '';
      toast('已重新开始识别');
      render();
    };

    // 麦克风开关：静音 ⇄ 语音跟随（静音时不调用 rec.start()，浏览器不会有任何提示音）
    var micBtn = el('button', 'btn btn-ghost btn-small', manual ? '开启语音跟随' : '静音');
    micBtn.onclick = function () {
      app.followMode = manual ? 'voice' : 'manual';
      if (app.manager) app.manager.stop();
      if (manual) { app.asrDegraded = false; app.userPaused = false; }
      toast(manual ? '已开启语音跟随（浏览器会发出系统提示音）' : '已静音，麦克风不再启动');
      render();
    };

    navFooter(ui, {
      extra: manual ? [micBtn] : [restartBtn, pauseBtn, micBtn],
      nextLabel: app.screenIndex < screens.length - 1 ? '下一屏' : '下一步',
      onNext: function () {
        if (app.screenIndex < screens.length - 1) { app.screenIndex++; render(); }
        else nextUnit();
      }
    });

    // 距上次收到识别结果的毫秒数（-1 表示不在识别状态）
    function asrIdle() {
      var m = app.manager;
      if (!m || !m.active || m.degraded) return -1;
      return Date.now() - (m.lastResultTs || m.startedAt || Date.now());
    }

    // 是否「识别不到」：只有此时才需要「重新识别」入口
    function needRestart() {
      var m = app.manager;
      if (!m || !ASR.available()) return false;       // 环境不支持：按钮无意义
      if (m.degraded || app.asrDegraded) return true; // 已降级：给一次手动重试机会
      if (!m.active) return false;                    // 用户主动暂停：不算识别不到
      var p = app.tracker ? app.tracker.progress() : 0;
      if (p >= V.threshold) return false;             // 已达标等静音：属正常流程
      var idle = asrIdle();
      return idle >= 0 && idle >= V.noResultMs;       // 长时间听不到任何内容
    }

    function syncRestartBtn() {
      restartBtn.style.display = needRestart() ? '' : 'none';
    }

    // 更新识别状态 UI：状态文字 + 覆盖率进度 + 是否正在识别（呼吸灯 / 流动条纹）
    function setVoiceStatus(txt, off) {
      var idle = asrIdle();
      var live = idle >= 0 && idle < V.liveWindowMs;
      dot.className = 'dot' + (live ? ' live' : (off || idle >= V.noResultMs ? ' idle' : ''));
      fill.className = 'prog-fill' + (live ? ' live' : '');
      if (txt !== undefined) {
        st.textContent = txt;
        st.className = 'st' + (off ? ' off' : '');
      }
      var p = app.tracker ? app.tracker.progress() : 0;
      pct.textContent = Math.round(p * 100) + '%';
      fill.style.width = Math.round(p * 100) + '%';
      heard.textContent = app.lastHeard ? ('听到：' + app.lastHeard) : '';
      syncRestartBtn();
    }

    function highlight() {
      if (!app.tracker) return;
      var cur = app.tracker.currentSentence();
      var spans = c.querySelectorAll('.sentence');
      for (var k = 0; k < spans.length; k++) {
        var idx = scr.from + k;
        spans[k].className = 'sentence' + (idx < cur ? ' done' : (idx === cur ? ' cur' : ''));
      }
      // 声音跟文字走：cursor 越过本屏 → 自动切屏
      if (cur > scr.to && app.screenIndex < screens.length - 1) {
        app.screenIndex++;
        render();
      }
    }

    // ASR 可用性
    var reason = null;
    if (!ASR.available()) reason = ASR.isWeChat() ? '微信内不可用·手动模式' : '识别不可用·手动模式';
    else if (app.asrDegraded) reason = '识别已降级·手动模式';
    else if (manual) reason = '静音模式·未启用麦克风';

    if (reason) {
      setVoiceStatus(reason, true);
      if (!ASR.available()) syncRestartBtn(); // 环境不支持：不给按钮；已降级：给手动重试
    }

    // 创建/复用 Manager
    if (!app.manager) {
      app.manager = new ASR.Manager({
        lang: V.lang,
        watchdogMs: V.watchdogMs,
        onResult: function (cum) {
          if (!app.tracker) return;
          app.tracker.feed(cum);
          // 记住最近听到的内容，让朗读者确认「它确实听到了我说的」
          app.lastHeard = (cum || '').replace(/\s+/g, '').slice(-16);
          setVoiceStatus('识别中…');
          highlight();
        },
        onStatus: function (s) {
          if (s === 'listening') setVoiceStatus(app.manager.lastResultTs > 0 ? '识别中…' : '聆听中');
          else if (s === 'paused') setVoiceStatus('已暂停');
        },
        onDegrade: function (r, hard) {
          app.asrDegraded = true;
          setVoiceStatus('识别已降级·手动模式', true);
          toast(hard
            ? '麦克风权限或服务不可用，请在浏览器设置中允许麦克风后重试'
            : '语音识别暂时不工作，可点「重新识别」重试或手动继续');
          render();
        }
      });
    }

    // 新建 Tracker（进度对本朗读单元整体计算，翻屏不清零）
    if (!app.tracker || app.tracker.unitId !== unit.id) {
      app.tracker = new Coverage.Tracker(sentences);
      app.tracker.unitId = unit.id;
      app.lastHeard = '';
    }

    // 仅在 ASR 仍可用时启动识别；reason（已降级/不可用/静音）时不重启
    if (!reason) {
      if (app.userPaused) {
        setVoiceStatus('已暂停');
      } else {
        // 实验：先拿到常驻麦克风流，再启动识别，部分系统可借此不再重复发出提示音
        if (app.micHold && !ASR.hasMicHold()) {
          ASR.holdMic(function () {
            app.manager.reset();
            app.manager.start();
            setVoiceStatus('聆听中');
          });
        } else {
          app.manager.reset();
          app.manager.start();
          setVoiceStatus('聆听中');
        }
      }
    }

    // 自动翻页 / 状态刷新轮询（500ms）—— 无论 ASR 是否可用都常驻，保证降级后仍按覆盖率翻页
    app.voiceTimer = setInterval(function () {
      if (!app.tracker || !app.manager) return;
      var m = app.manager;
      var p = app.tracker.progress();
      // 覆盖率已达标：不再重启识别会话，避免达标后仍在滴滴响（每次 rec.start() 都是一次系统提示音）
      if (m) m.hold = (p >= V.threshold);
      var lastTs = m.lastResultTs || 0;
      // 已降级时 ASR 已不可用，按"自上次成功识别后 ≥ silenceMs"判定静音（lastTs 是降级前最后一次成功识别的时间戳）
      var silent = lastTs > 0 && Date.now() - lastTs >= V.silenceMs;
      var ok = (p >= V.threshold || app.tracker.doneAll()) && silent && lastTs > 0;
      if (ok) {
        if (app.screenIndex < screens.length - 1) { app.screenIndex++; render(); }
        else { toast('朗读完成，自动进入下一步'); nextUnit(); }
        return;
      }
      if (reason || !m.active || m.degraded) { syncRestartBtn(); return; }
      if (p >= V.threshold && !silent) {
        setVoiceStatus('已达标，等待静音 ' + (V.silenceMs / 1000) + ' 秒…');
      } else if (lastTs > 0 && Date.now() - lastTs >= V.liveWindowMs) {
        setVoiceStatus('聆听中（暂未识别到内容）');
      } else if (lastTs === 0 && Date.now() - (m.startedAt || Date.now()) >= V.noResultMs) {
        setVoiceStatus('未听到声音·请检查麦克风', true);
      } else {
        setVoiceStatus(lastTs > 0 ? '识别中…' : '聆听中');
      }
    }, 500);
  }

  // ---- 量表首页 ----
  function renderQIntro(ui, unit) {
    var q = FLOW.questionnaires[unit.qid];
    var b = ui.body;
    b.appendChild(el('h3', 'section-title', q.title));
    var meta = [];
    meta.push('共 ' + q.items.length + ' 题');
    if (q.needsReadAloud) meta.push('每题先朗读题目再作答');
    if (q.allowsSkip) meta.push('可跳过整份量表');
    b.appendChild(el('p', 'q-hint', '· ' + meta.join(' · ')));
    if (q.scoreOptions) {
      b.appendChild(el('p', 'q-hint', '根据在过去数天内的情况，选择各项情绪对来访者的困扰程度。'));
    }

    var startBtn = el('button', 'btn btn-primary btn-block', '开始答题');
    startBtn.onclick = function () { nextUnit(); };
    b.appendChild(startBtn);

    var skipBtn = null;
    if (q.allowsSkip) {
      skipBtn = el('button', 'btn btn-warn btn-small', '跳过此量表');
      skipBtn.onclick = function () {
        q.items.forEach(function (item, i) { delete app.session.answers[q.id + '-' + (i + 1)]; });
        setRecord('skip_' + q.id, q.title, '整份量表', '跳过', '跳过');

        // 跳到本量表最后一题之后
        var last = app.unitIndex;
        for (var i = app.unitIndex; i < UNITS.length; i++) {

        }

      };
    }
    navFooter(ui, { extra: skipBtn ? [skipBtn] : null, noSkip: true, nextLabel: '开始', onNext: function () { nextUnit(); } });
    // 用 footer 的下一步与开始答题等价；隐藏 body 内重复按钮
    startBtn.style.display = 'none';

  // ---- 单题屏 ----
  function renderQuestion(ui, unit) {
    var q = FLOW.questionnaires[unit.qid];
    var item = unit.item;
    var b = ui.body;
    var answered = app.session.answers[unit.id];

    b.appendChild(el('div', 'q-text', (unit.index + 1) + '. ' + item.text));
    var opts = el('div', 'opts');
    b.appendChild(opts);

    function buildOptions() {
      opts.innerHTML = '';
      item.options.forEach(function (o) {
        var val = o;
        if (q.scoreOptions) val = parseInt(o, 10);
        var btn = el('button', 'opt-btn' + (answered === val ? ' picked' : ''), o);
        btn.onclick = function () {
          app.session.answers[unit.id] = val;
          var ansType = q.scoreOptions ? '0-3评分' : (item.options.length === 2 ? '是/否' : '选项');
          setRecord(unit.id, q.title, item.text, ansType, q.scoreOptions ? val + '（' + o.split('·')[1] + '）' : o);
          saveSession();
          opts.querySelectorAll('.opt-btn').forEach(function (x) { x.className = 'opt-btn'; });
          btn.className = 'opt-btn picked';
          setTimeout(nextUnit, 420);
        };
        opts.appendChild(btn);
      });
    }

    // 选项与朗读同步呈现：进入题目即可点选，选定后自动翻页
    if (q.needsReadAloud) {
      b.insertBefore(el('p', 'q-hint', '请向来访者朗读题目；选项已同时显示，选定后自动进入下一题。'), opts);
    }
    buildOptions();

    navFooter(ui, {});
  }

  // ---- 来访者状态轮 ----
  function renderStateRound(ui, unit) {
    var sf = FLOW.stateForm;
    var options = unit.domain === 'emotion' ? sf.emotionOptions : sf.bodyOptions;
    var domName = unit.domain === 'emotion' ? '情绪状态' : '身体状态';
    var phaseName = unit.phase === 'pre' ? '催眠前' : '催眠后';
    var b = ui.body;

    b.appendChild(el('h3', 'section-title', phaseName + ' · ' + domName + '（第' + unit.round + '轮 / 最多' + sf.maxRounds + '轮）'));
    b.appendChild(el('p', 'q-hint', '选择' + domName + '（可多选，按类别分组、可上下滑动），再为每项打 0–10 分（0=无 → 10=极重）。'));

    // 催眠后（步骤12.3）：回显催眠前（步骤1.4.3）同一轮已记录的项目与分数，并自动带入下方供修改
    var preSel = null;
    if (unit.phase === 'post') {
      var preId = 'state_pre_' + (unit.domain === 'emotion' ? 'e' : 'b') + unit.round;
      var preAns = app.session.answers[preId];
      preSel = (preAns && preAns.selections) || null;
      var preBox = el('div', 'pre-echo');
      preBox.appendChild(el('div', 'pre-echo-t', '催眠前（步骤 1.4.3）第 ' + unit.round + ' 轮记录'));
      if (!preSel || !Object.keys(preSel).length) {
        preBox.appendChild(el('div', 'pre-echo-empty', '（催眠前未记录）'));
      } else {
        var prow = el('div', 'pre-chips');
        Object.keys(preSel).forEach(function (n) {
          prow.appendChild(el('span', 'pre-chip', n + ' ' + preSel[n] + ' 分'));
        });
        preBox.appendChild(prow);
        preBox.appendChild(el('div', 'pre-echo-note', '已自动带入下方「催眠后」选项与分数，可直接改分、取消勾选或新增项目。'));
      }
      b.appendChild(preBox);
    }

    // 选项区 + 打分区放在同一个可滚动容器里（身体状态有 47 项，需要滚动）
    var scroll = el('div', 'state-scroll');
    b.appendChild(scroll);

    var groups = unit.domain === 'emotion' ? sf.emotionGroups : sf.bodyGroups;
    var chipBox = el('div');
    scroll.appendChild(chipBox);
    var scoreArea = el('div');
    scroll.appendChild(scoreArea);

    var CUSTOM_PREFIX = '其他：';
    function isCustom(n) { return typeof n === 'string' && n.indexOf(CUSTOM_PREFIX) === 0; }

    var selected = {};  // name -> {picked, score, fromPre}
    var customs = [];   // [{text, score}] —— 「其他」自定义项
    var otherPicked = false;

    function seed(obj, fromPre) {
      if (!obj) return;
      Object.keys(obj).forEach(function (k) {
        if (isCustom(k)) {
          customs.push({ text: k.slice(CUSTOM_PREFIX.length), score: obj[k] });
          otherPicked = true;
        } else {
          selected[k] = { picked: true, score: obj[k], fromPre: !!fromPre };
        }
      });
    }
    // 本单元已有保存答案时以它为准；否则（催眠后首次进入）带入催眠前记录作为预填
    var prev = app.session.answers[unit.id];
    if (prev && prev.selections) seed(prev.selections, false);
    else if (unit.phase === 'post') seed(preSel, true);

    function buildScoreOpts(cur, onPick) {
      var so = el('div', 'score-opts');
      for (var v = 0; v <= 10; v++) {
        (function (vv) {
          var bt = el('button', cur === vv ? 'picked' : '', String(vv));
          bt.onclick = function () { onPick(vv); };
          so.appendChild(bt);
        })(v);
      }
      return so;
    }

    // 「其他」自定义项：文本框 + 0-10 评分
    function buildCustomBlock() {
      var box = el('div', 'other-box');
      box.appendChild(el('div', 'other-t', '其他 — 请填写具体' + domName + '，并打 0–10 分（0=无 → 10=极重）'));
      customs.forEach(function (c, i) {
        var row = el('div', 'other-row');
        var inp = el('input', 'other-input');
        inp.type = 'text';
        inp.setAttribute('type', 'text');
        inp.placeholder = unit.domain === 'emotion' ? '例如：委屈' : '例如：手抖';
        inp.value = c.text || '';
        inp.oninput = function () { c.text = inp.value.trim(); };
        row.appendChild(inp);
        if (customs.length > 1) {
          var del = el('button', 'other-del', '×');
          del.setAttribute('title', '删除此项');
          del.onclick = function () { customs.splice(i, 1); renderScores(); };
          row.appendChild(del);
        }
        box.appendChild(row);
        var srow = el('div', 'score-row');
        srow.appendChild(el('div', 'score-name',
          (c.text || '（未填写）') + '：' + (c.score !== undefined ? c.score + ' 分' : '请打分')));
        srow.appendChild(buildScoreOpts(c.score, function (v) { c.score = v; renderScores(); }));
        box.appendChild(srow);
      });
      var add = el('button', 'other-add', '＋ 再添加一项');
      add.onclick = function () { customs.push({ text: '', score: undefined }); renderScores(); };
      box.appendChild(add);
      return box;
    }

    function renderScores() {
      scoreArea.innerHTML = '';
      Object.keys(selected).forEach(function (name) {
        if (!selected[name].picked) return;
        var row = el('div', 'score-row');
        row.appendChild(el('div', 'score-name',
          name + '：' + (selected[name].score !== undefined ? selected[name].score + ' 分' : '请打分')));
        row.appendChild(buildScoreOpts(selected[name].score, function (v) {
          selected[name].score = v;
          renderScores();
        }));
        scoreArea.appendChild(row);
      });
      if (otherPicked) scoreArea.appendChild(buildCustomBlock());
    }

    // 按分组渲染（无分组配置时退化为平铺）
    function renderChips() {
      chipBox.innerHTML = '';
      (groups && groups.length ? groups : [{ name: '', items: options }]).forEach(function (g) {
        var wrap = el('div', 'chip-group');
        if (g.name) wrap.appendChild(el('div', 'chip-group-t', g.name));
        var row = el('div', 'chips');
        g.items.forEach(function (name) {
          if (name === '其他' || name === '其他：') {
            var oChip = el('button', 'chip' + (otherPicked ? ' on' : ''), '其他');
            oChip.onclick = function () {
              otherPicked = !otherPicked;
              if (otherPicked && !customs.length) customs.push({ text: '', score: undefined });
              oChip.className = 'chip' + (otherPicked ? ' on' : '');
              renderScores();
            };
            row.appendChild(oChip);
            return;
          }
          var chip = el('button', 'chip' + (selected[name] && selected[name].picked ? ' on' : ''), name);
          chip.onclick = function () {
            if (!selected[name]) selected[name] = { picked: false };
            selected[name].picked = !selected[name].picked;
            chip.className = 'chip' + (selected[name].picked ? ' on' : '');
            renderScores();
          };
          row.appendChild(chip);
        });
        wrap.appendChild(row);
        chipBox.appendChild(wrap);
      });
    }
    renderChips();
    renderScores();

    function collect() {
      var sel = {};
      Object.keys(selected).forEach(function (name) {
        if (selected[name].picked && selected[name].score !== undefined) sel[name] = selected[name].score;
      });
      if (otherPicked) {
        customs.forEach(function (c) {
          var t = (c.text || '').trim();
          if (t && c.score !== undefined) sel[CUSTOM_PREFIX + t] = c.score;
        });
      }
      return sel;
    }

    var skipBtn = null;
    if (unit.round >= 2) {
      skipBtn = el('button', 'btn btn-warn btn-small', '跳过此轮');
      skipBtn.onclick = function () {
        setRecord(unit.id, '来访者状态（' + phaseName + '）', domName + '·第' + unit.round + '轮', '多选+0-10', '跳过');
        saveSession();
        nextUnit();
      };
    }

    navFooter(ui, {
      extra: skipBtn ? [skipBtn] : null,
      nextLabel: '确认记录',
      nextDisabled: false,
      onNext: function () {
        var sel = collect();
        var names = Object.keys(sel);
        if (!names.length) {
          setRecord(unit.id, '来访者状态（' + phaseName + '）', domName + '·第' + unit.round + '轮', '多选+0-10', '未记录');
        } else {
          app.session.answers[unit.id] = { selections: sel };
          setRecord(unit.id, '来访者状态（' + phaseName + '）', domName + '·第' + unit.round + '轮', '多选+0-10',
            names.map(function (n) { return n + ':' + sel[n]; }).join('，'));
        }
        saveSession();
        nextUnit();
      }
    });
  }

  // ---- 前后对比表 ----
  function renderComparison(ui, unit) {
    var sc = computeScores(app.session);
    var b = ui.body;
    b.appendChild(el('h3', 'section-title', '催眠前后评分对比'));

    function cell(v) {
      if (v === null || v === undefined) return '跳过';
      if (v > 0) return '+' + v;
      return String(v);
    }
    function rowHtml(name, o) {
      var d = o.delta;
      var cls = d === null ? '' : (d < 0 ? 'down' : (d > 0 ? 'up' : ''));
      return '<tr><td>' + name + '</td><td>' + (o.pre === null ? '跳过' : o.pre) + '</td><td>' +
        (o.post === null ? '跳过' : o.post) + '</td><td class="' + cls + '">' + cell(d) + '</td></tr>';
    }
    var tb = el('table', 'cmp-table');
    tb.innerHTML = '<tr><th>指标</th><th>催眠前</th><th>催眠后</th><th>差异</th></tr>' +
      rowHtml('BDC 量表总分', sc.bdc) +
      rowHtml('BAI 量表总分', sc.bai) +
      rowHtml('情绪状态评分合计', sc.state.emotion) +
      rowHtml('身体状态评分合计', sc.state.body);
    b.appendChild(tb);
    b.appendChild(el('p', 'q-hint', '差异 = 催眠后 − 催眠前；负数表示催眠后评分下降。'));

    if (sc.stateDetails.length) {
      var box = el('div', 'detail-box');
      box.appendChild(el('h4', '', '情绪 / 身体状态选择明细'));
      sc.stateDetails.forEach(function (d) {
        box.appendChild(el('p', '', (d.phase === 'pre' ? '催眠前' : '催眠后') + ' · ' +
          (d.domain === 'emotion' ? '情绪' : '身体') + ' · 第' + d.round + '轮：' + d.text));
      });
      b.appendChild(box);
    }
    if (sc.qTotal !== null) {
      var qbox = el('div', 'detail-box');
      qbox.appendChild(el('h4', '', '暗示感受性'));
      qbox.appendChild(el('p', '', '躯体型 ' + Math.round(sc.somaticPct * 100) + '% · 情绪型 ' + Math.round(sc.emotionalPct * 100) + '%'));
      b.appendChild(qbox);
    }

    var exportBtn = el('button', 'btn btn-ghost btn-small', '导出 CSV');
    exportBtn.onclick = function () { exportCsv(); };

    navFooter(ui, {
      extra: [exportBtn],
      nextLabel: '完成流程',
      onNext: function () { finishSession(); }
    });
  }

  function finishSession() {
    stopTimers();
    var s = app.session;
    if (s && s.status === 'running') {
      s.status = 'done';
      s.endTime = Date.now();
      saveSession();
    }
    Store.clearSnapshot();
    app.view = 'done';
    render();
  }

  function exportCsv() {
    var sc = computeScores(app.session);
    var csv = CSV.build(app.session, sc);
    var name = '催眠流程_' + app.session.id + '.csv';
    var ok = CSV.download(name, csv, $('.body'));
    if (ok) toast('CSV 已开始下载');
  }

    var sc = computeScores(app.session);
    var box = el('div', 'done-hero');
    box.appendChild(el('div', 'icon', '🌿'));
    box.appendChild(el('h2', '', '本次流程已完成'));

  // ================= 记录页 =================
  function renderRecords(root) {
    var ui = screen('问答记录', null);
    var b = ui.body;
    b.style.overflowY = 'auto';
    b.style.padding = '14px 16px';
    var list = Store.list();
    ui.ft.innerHTML = '';
    var back = el('button', 'btn btn-ghost', '返回首页');
    back.onclick = function () { app.view = 'home'; render(); };
    ui.ft.appendChild(back);
    var allBtn = el('button', 'btn btn-primary', '导出全部 CSV');
    allBtn.onclick = function () {
      var rows = [];
      list.forEach(function (s) {
        rows.push(CSV.build(s, s.status === 'done' ? computeScoresFor(s) : null));
      });
      var ok = CSV.download('催眠流程_全部记录.csv', rows.join('\r\n\r\n'), b);
      if (ok) toast('CSV 已开始下载');
    };
    ui.ft.appendChild(allBtn);

    if (!list.length) {
      b.appendChild(el('p', 'q-hint', '暂无记录。完成一次流程后会保存到本机。'));
      return;
    }
    b.appendChild(el('p', 'q-hint', '数据仅保存在本机浏览器，清除浏览器缓存会丢失，请定期导出备份。'));
    list.forEach(function (s) {
      var item = el('div', 'rec-item');
      item.appendChild(el('div', 't', (s.clientName || '未命名') + ' · ' + (s.status === 'done' ? '已完成' : '进行中')));
      item.appendChild(el('div', 'm', s.id + ' · ' + fmtTime(s.startTime) + ' · ' + (s.records ? s.records.length : 0) + ' 条记录'));
      item.onclick = function () { app.detailId = s.id; app.view = 'detail'; render(); };
      b.appendChild(item);
    });
  }

  function computeScoresFor(s) {
    var cur = app.session;
    app.session = s;
    var r = computeScores(s);
    app.session = cur;
    return r;
  }

  function renderDetail(root) {
    var s = Store.get(app.detailId);
    if (!s) { app.view = 'records'; render(); return; }
    var ui = screen(s.clientName || '未命名', s.id + ' · ' + fmtTime(s.startTime));
    var b = ui.body;
    b.style.overflowY = 'auto';
    var sc = null;
    if (s.status === 'done') sc = computeScoresFor(s);

    b.appendChild(el('p', 'q-hint', (s.goal ? '目标：' + s.goal + ' · ' : '') +
      (s.status === 'done' ? '已完成 · ' + fmtTime(s.endTime || s.startTime) : '进行中')));

    if (sc) {
      b.appendChild(el('h4', 'section-title', '结果汇总'));
      var box = el('div', 'detail-box');
      function line(t, v) { box.appendChild(el('p', '', t + '：' + v)); }
      if (sc.qTotal !== null) {
        line('暗示感受性总分', sc.qTotal + ' / 200');
        line('躯体型 / 情绪型', Math.round(sc.somaticPct * 100) + '% / ' + Math.round(sc.emotionalPct * 100) + '%');
      }
      line('BDC 前测 / 后测', (sc.bdc.pre === null ? '跳过' : sc.bdc.pre) + ' / ' + (sc.bdc.post === null ? '跳过' : sc.bdc.post));
      line('BAI 前测 / 后测', (sc.bai.pre === null ? '跳过' : sc.bai.pre) + ' / ' + (sc.bai.post === null ? '跳过' : sc.bai.post));
      line('情绪评分 前 / 后', (sc.state.emotion.pre === null ? '—' : sc.state.emotion.pre) + ' / ' + (sc.state.emotion.post === null ? '—' : sc.state.emotion.post));
      line('身体评分 前 / 后', (sc.state.body.pre === null ? '—' : sc.state.body.pre) + ' / ' + (sc.state.body.post === null ? '—' : sc.state.body.post));
      b.appendChild(box);
    }

    b.appendChild(el('h4', 'section-title', '问答明细（' + (s.records || []).length + ' 条）'));
    var lastGroup = null;
    (s.records || []).forEach(function (r) {
      if (r.group !== lastGroup) {
        lastGroup = r.group;
        var g = el('div', 'rec-group');
        g.appendChild(el('h4', '', '【' + r.group + '】'));
        b.appendChild(g);
      }
      var line = el('p', '', (r.question || '') + (r.question ? ' → ' : '') + r.answer);
      line.style.cssText = 'font-size:13.5px;color:#5a554e;line-height:1.7;margin-left:8px;';
      b.appendChild(line);
    });

    ui.ft.innerHTML = '';
    var back = el('button', 'btn btn-ghost', '返回');
    back.onclick = function () { app.view = 'records'; render(); };
    ui.ft.appendChild(back);
    var exBtn = el('button', 'btn btn-primary', '导出 CSV');
    exBtn.onclick = function () {
      var ok = CSV.download('催眠流程_' + s.id + '.csv', CSV.build(s, sc), b);
      if (ok) toast('CSV 已开始下载');
    };
    ui.ft.appendChild(exBtn);
    var delBtn = el('button', 'btn btn-warn', '删除');
    delBtn.onclick = function () {
      if (confirm('确定删除该会话记录？删除后不可恢复。')) {
        Store.remove(s.id);
        app.view = 'records';
        render();
      }
    };
    ui.ft.appendChild(delBtn);
  }

  // ================= 生命周期 =================
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (app.manager) app.manager.pause();
      snapshot();
    } else {
      var unit = UNITS[app.unitIndex];
      if (app.view === 'run' && unit && unit.type === 'reading' && !app.userPaused &&
          app.manager && !app.manager.degraded) {
        app.manager.resume();
      }
    }
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (app.view === 'run') { app.screenIndex = 0; render(); }
    }, 300);
  });

  render();
  }

  // 启动分发：明文直接启动；加密则弹密码门；二者皆无则报错
  if (window.__FLOW__) bootApp();
  else if (window.__FLOW_ENC__) renderGate(bootApp);
  else document.body.innerHTML = '数据加载失败';
})();

</script>
</body>
</html>
